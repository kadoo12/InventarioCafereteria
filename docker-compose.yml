version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: practical_keller
    environment:
      POSTGRES_DB: inventario
      POSTGRES_PASSWORD: password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - inventario-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
  build:
    context: ./Servicio_Inventario
  container_name: inventario-backend
  environment:
    DB_HOST: postgres
    DB_PORT: 5432
    DB_NAME: inventario
    DB_USER: postgres
    DB_PASSWORD: password
    SPRING_JPA_HIBERNATE_DDL_AUTO: update
  ports:
    - "8081:8081"
  volumes:
    - ./Servicio_Inventario/src:/app/src
    - ./Servicio_Inventario/pom.xml:/app/pom.xml
  depends_on:
    postgres:
      condition: service_healthy
  networks:
    - inventario-network
  develop:
    watch:
      - action: sync
        path: ./Servicio_Inventario/src
        target: /app/src


  frontend:
    image: inventario-frontend
    container_name: inventario-frontend
    ports:
      - "3000:3000"
    depends_on:
      - backend
    networks:
      - inventario-network

volumes:
  postgres_data:

networks:
  inventario-network:
    driver: bridge
